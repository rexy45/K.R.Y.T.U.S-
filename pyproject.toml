[project]
name = "krytus"
version = "0.1.0"
description = "Autonomous personal AI chief-of-staff accessible via Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30.0",
    "google-generativeai>=0.8.0",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "aiosmtplib>=3.0",
    "tenacity>=8.2",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "edge-tts>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krytus"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]